# Server Configuration
server.port=8080

# Default Database Configuration (H2 in MySQL-compatible mode for out-of-the-box readiness)
spring.datasource.url=${DB_URL:jdbc:h2:mem:bank_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# JWT Stateless Security Configuration
bank.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
bank.security.jwt.expiration-ms=86400000

# Logging Pattern with Correlation ID (MDC)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:-SYSTEM}] %-5level %logger{36} - %msg%n

# Security & CORS
bank.security.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,http://localhost:8080,null,*
